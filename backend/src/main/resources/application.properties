spring.application.name=app

# Configuración externalizada. Los valores por defecto son únicamente para ejecución académica local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elsoldorado}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-frase-larga-de-al-menos-32-caracteres}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

